pre-push:
  parallel: false
  commands:
    formatting:
      run: npm run format:check
    lint:
      run: npm run lint

commit-msg:
  commands:
    conventional-commits:
      run: |
        head -n1 {1} | grep -Eq '^(Merge |Revert )|^(feat|fix|refactor|docs|style|test|chore|build|ci|perf|revert)(\([a-z0-9._/-]+\))?!?: .+' || {
          echo 'Mensagem de commit fora do padrão Conventional Commits.'
          echo 'Use: <tipo>(escopo opcional): descrição  — ex.: "feat(gerentes): adiciona filtro por loja"'
          exit 1
        }
