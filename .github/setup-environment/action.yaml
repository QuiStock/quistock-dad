name: Setup Node environment
description: Sets up Node.js, the npm cache, and locked project dependencies

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm

    - name: Install locked dependencies
      shell: bash
      run: npm ci
