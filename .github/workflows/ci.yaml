name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/setup-environment
      - name: Build production bundle
        run: npm run build

  lint-and-formatting:
    name: Lint and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/setup-environment
      - name: Check lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check

  type-checks:
    name: Type checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/setup-environment
      - name: Check TypeScript types
        run: npm run typecheck

  code-smell:
    name: Code smell analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/setup-environment
      - name: Analyse code smells
        shell: bash
        run: |
          mkdir -p reports/code-smell
          npx eslint src \
            --config eslint.code-smell.config.js \
            --max-warnings=0 \
            --format @microsoft/eslint-formatter-sarif \
            --output-file reports/code-smell/eslint.sarif
      - name: Upload code smell report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-smell-reports
          path: reports/code-smell/eslint.sarif
          if-no-files-found: warn
          retention-days: 7

  unit-tests:
    name: Unit and component tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/setup-environment
      - name: Run tests
        shell: bash
        run: |
          mkdir -p reports/unit-tests
          npm test -- \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=reports/unit-tests/test-results.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: reports/unit-tests/test-results.xml
          if-no-files-found: warn
          retention-days: 7

  test-coverage-validation:
    name: Test coverage validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/setup-environment
      - name: Validate coverage thresholds
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 7

  e2e-tests:
    name: End-to-end smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/setup-environment
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production bundle
        run: npm run build
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
